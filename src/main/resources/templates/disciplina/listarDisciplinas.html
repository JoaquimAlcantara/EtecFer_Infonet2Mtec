<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de disciplina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-etec">
        <div class="container">
            <a class="navbar-brand" href="/">EtecFer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/alunos/listar">Alunos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cursos/listar">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/professores/listar">Professores</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/disciplinas/listar">Disciplinas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold mb-0">Disciplinas</h1>
            <a href="/disciplinas/criar" class="btn btn-etec">
                <i class="bi bi-plus-lg"></i> Nova Disciplina
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Sigla</th>
                            <th>Carga Horária</th>
                            <th colspan="2" class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="disciplina : ${disciplinas}">
                            <td th:text="${disciplina.nomeDisciplina}">#</td>
                            <td th:text="${disciplina.siglaDisciplina}">#</td>
                            <td th:text="${disciplina.chDisciplina}">#</td>
                            <td class="text-center" style="width: 1%; white-space: nowrap;">
                                <a th:href="@{/disciplinas/editar/{id}(id=${disciplina.idDisciplina})}" class="btn btn-sm btn-outline-warning">
                                    <i class="bi bi-pencil-fill"></i> Editar
                                </a>
                                <a th:href="@{/disciplinas/excluir/{id}(id=${disciplina.idDisciplina})}" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Tem certeza que deseja excluir esta disciplina?');">
                                    <i class="bi bi-trash-fill"></i> Excluir
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
