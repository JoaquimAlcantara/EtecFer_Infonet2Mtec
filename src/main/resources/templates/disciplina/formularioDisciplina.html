<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de disciplina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-etec">
        <div class="container">
            <a class="navbar-brand" href="/">EtecFer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/alunos/listar">Alunos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cursos/listar">Cursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/professores/listar">Professores</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/disciplinas/listar">Disciplinas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">

        <h1 class="text-center fw-bold mb-4">Cadastrar disciplina</h1>

        <div class="card card-form shadow-sm">
            <div class="card-body p-4">

                <form th:action="@{/disciplinas/salvar}" method="post" th:object="${disciplina}">

                    <input type="hidden" th:field="*{idDisciplina}"/>

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" th:field="*{nomeDisciplina}"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Sigla</label>
                        <input type="text" class="form-control" th:field="*{siglaDisciplina}"/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Carga Horária</label>
                        <input type="text" class="form-control" th:field="*{chDisciplina}"/>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/disciplinas/listar" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                        <button type="submit" class="btn btn-etec">
                            <i class="bi bi-check-lg"></i> Salvar
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
